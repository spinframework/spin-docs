name: Update CLI reference

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Spin version to generate the reference for (e.g. v4.1.0)"
        required: false
        default: latest
  repository_dispatch:
    types:
      - spin-release

jobs:
  create-pr:
    name: Create PR with CLI reference bumped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download Spin
        uses: fermyon/actions/spin/setup@v1
        with:
          version: ${{ github.event.client_payload.version || inputs.version || 'latest' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate reference doc
        id: generate
        run: |
          SPIN_VERSION=$(spin --version | awk '{print $2}')
          MAJOR=${SPIN_VERSION%%.*}
          DOC="content/v${MAJOR}/cli-reference.md"
          if [ ! -f "$DOC" ]; then
            echo "::error::$DOC does not exist - fork the docs for Spin v${MAJOR} before regenerating the CLI reference"
            exit 1
          fi

          # Truncate the doc at the '---'
          sed -i '/^---$/q' "$DOC"

          spin maintenance generate-reference >> "$DOC"
          echo "spin-version=$SPIN_VERSION" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Update CLI reference for Spin ${{ steps.generate.outputs.spin-version }}"
          title: "Update CLI reference for Spin ${{ steps.generate.outputs.spin-version }}"
          body: "Update the Spin CLI reference to match Spin ${{ steps.generate.outputs.spin-version }}."
          branch: bump-spin-cli-reference-v${{ steps.generate.outputs.major }}
          base: main
          delete-branch: true
          committer: spinframeworkbot <202838904+spinframeworkbot@users.noreply.github.com>
          author: spinframeworkbot <202838904+spinframeworkbot@users.noreply.github.com>
          signoff: true
          token: ${{ secrets.PAT }}
